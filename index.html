<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин: каталог и заказ</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #d9534f;
            --warning: #f39c12;
            --success: #27ae60;
            --bg: #f4f6f9;
            --panel-bg: #ffffff;
        }
        body { background-color: var(--bg); font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .cart-summary { background: #fff; border: 1px solid #ddd; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .cart-total { font-weight: bold; color: var(--accent); }
        .wrapper { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .search-box { margin-bottom: 20px; text-align: center; }
        #userSearch { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; width: 300px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .product-card { background: var(--panel-bg); border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .product-name { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; word-break: break-word; }
        .product-price { font-size: 1.1rem; color: var(--primary); margin-bottom: 10px; font-weight: 600; }
        .product-barcode { font-size: 1rem; color: #666; margin-bottom: 8px; font-family: monospace; letter-spacing: 0.5px; }
        .product-expiry { font-size: 0.85rem; margin-bottom: 10px; }
        .expiry-ok { color: #27ae60; }
        .expiry-soon { color: #f39c12; }
        .expiry-expired { color: #c0392b; font-weight: bold; }
        .stock-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; transition: background 0.2s, color 0.2s; }
        .stock-ok { background: #e8f5e9; color: var(--success); }
        .stock-medium { background: #fff3cd; color: var(--warning); }
        .stock-low { background: #f8d7da; color: var(--danger); }
        .in-cart-note { font-size: 0.8rem; color: var(--accent); margin: -8px 0 10px; }
        button.btn-add { background: var(--success); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: auto; }
        button.btn-add:hover:not(:disabled) { background: #219150; }
        button.btn-add:disabled { background: #ccc; cursor: not-allowed; }
        .cart-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; margin-top: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .cart-empty { color: #888; text-align: center; padding: 20px; }
        .cart-list { width: 100%; border-collapse: collapse; }
        .cart-list th, .cart-list td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        .cart-qty-input { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .qty-hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
        .btn-remove { background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        .order-form { margin-top: 25px; background: var(--panel-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-full { grid-column: 1 / -1; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button.btn-submit { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 1.05rem; margin-top: 10px; }
        button.btn-submit:hover { background: #1a252f; }
        footer { text-align: center; padding: 20px; color: #888; font-size: 0.9rem; }

        /* СТИЛИ ЧАТА АДМИНА */
        .admin-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .admin-chat-header {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: bold;
        }
        .admin-chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 18px;
            line-height: 1.4;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
        }
        .message.admin {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
        }
        .admin-chat-form {
            display: flex;
            border-top: 1px solid #eee;
        }
        .admin-chat-form input {
            flex-grow: 1;
            border: none;
            padding: 12px 15px;
            font-size: 0.95rem;
        }
        .admin-chat-form button {
            background: var(--success);
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .admin-chat-form button:hover {
            background: #219150;
        }
    </style>
</head>
<body>
    <header>
        <h1>Магазин: каталог и заказ</h1>
        <div class="cart-summary" onclick="window.scrollTo({top: document.getElementById('cart').offsetTop, behavior: 'smooth'})">
            Корзина: <span class="cart-total" id="cartTotal">0 ₽</span>
            (<span id="cartCount">0</span> позиций)
        </div>
    </header>

    <div class="wrapper">
        <div class="search-box">
            <input type="text" id="userSearch" placeholder="Поиск товара…">
        </div>
        <div class="products-grid" id="productsGrid">
            <!-- Карточки товаров будут добавлены JS -->
        </div>
    </div>

    <div class="wrapper" id="cart">
        <div class="cart-panel">
            <h2>Ваша корзина</h2>
            <table class="cart-list" id="cartTable">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>ШК</th>
                        <th>Годен до</th>
                        <th>Цена (₽)</th>
                        <th>Кол-во</th>
                        <th>Сумма (₽)</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cartBody">
                    <!-- Позиции корзины будут добавлены JS -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="5" style="text-align:right; font-weight:bold;">Итого:</td>
                        <td id="cartFooterTotal" style="font-weight:bold; text-align:left;">0 ₽</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            <div id="cartEmpty" class="cart-empty" style="display:none;">Корзина пуста</div>
        </div>

        <div class="order-form">
            <h3>Оформить заказ</h3>
            <p style="margin-bottom:15px; color:#666;">Поля обязательны для заполнения</p>
            <form id="orderForm">
                <div class="form-row">
                    <div>
                        <label><b>ФИО</b></label>
                        <input type="text" required placeholder="Иванов Иван Иванович">
                    </div>
                    <div>
                        <label><b>Телефон</b></label>
                        <input type="tel" required placeholder="+7 (999) 000-00-00">
                    </div>
                </div>
                <div class="form-row form-full">
                    <label><b>Комментарий к заказу</b></label>
                    <textarea rows="3" placeholder="Самовывоз, доставка, особые пожелания…"></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить заказ</button>
            </form>
        </div>
    </div>

    <!-- БЛОК ЧАТА АДМИНА -->
    <div class="admin-chat" id="adminChat">
        <div class="admin-chat-header">Поддержка магазина</div>
        <div class="admin-chat-messages" id="adminMessages"></div>
        <form class="admin-chat-form" id="adminChatForm">
            <input type="text" placeholder="Напишите сообщение..." autocomplete="off" required />
            <button type="submit">Отправить</button>
        </form>
    </div>

    <footer>
        Режим прототипа. Данные не сохраняются в базе.
    </footer>

    <script>
const products = [
{ id: '1', name: 'Масло сливочное безлактозное DANKE 82.5%, фас. в фольгу, 160гр', price: 135, stock: 9, barcode: '4607012345678', expiry: '2026-10-15' },
{ id: '2', name: 'Молоко 1,5% ультрапаст "Тетра-Брик-Асептик-Сквэр" 1000мл ТМ "Милкавита"', price: 65, stock: 126, barcode: '4811309012580' , expiry: '2026-09-01' },
{ id: '3', name: 'Молоко 3,2% ультрапаст "Тетра-Брик-Асептик-Сквэр" 1000мл ТМ "Милкавита"', price: 85, stock: 4, barcode: '4810123000018', expiry: '2026-08-28' },
{ id: '4', name: 'Напиток Тайран по-турецки со вкусом солен огурца с укропом м.д.ж. 1,5%, стакан из полипропил, 220 гр', price: 22, stock: 4, barcode: '4600123000025', expiry: '2026-08-23' },
{ id: '5', name: 'Сливки питьевые ультрапастеризованные массовой долей жира 20%, 500г', price: 115, stock: 529, barcode: '4600123000032', expiry: '2026-12-01' },
{ id: '6', name: 'Кефир 2,5% пэт-бутылка 900г ТМ "Милкавита"', price: 55, stock: 60, barcode: '4600123000049', expiry: '2026-08-25' }
];

        const grid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('userSearch');
        const cartBody = document.getElementById('cartBody');
        const cartEmpty = document.getElementById('cartEmpty');
        const cartTotalEl = document.getElementById('cartTotal');
        const cartCountEl = document.getElementById('cartCount');
        const cartFooterTotalEl = document.getElementById('cartFooterTotal');

        let cart = [];

        // --- НАЧАЛО КОДА ЧАТА ---
        const adminChat = document.getElementById('adminChat');
        const adminMessages = document.getElementById('adminMessages');
        const adminChatForm = document.getElementById('adminChatForm');

        function loadAdminHistory() {
            const history = JSON.parse(localStorage.getItem('admin_chat_history')) || [];
            if (history.length > 0) {
                setTimeout(() => {
                    history.forEach(msg => addMessageToChat(msg.text, msg.from));
                }, 100);
            }
        }

        function saveAdminHistory(text, from) {
            let history = JSON.parse(localStorage.getItem('admin_chat_history')) || [];
            history.push({ text: text, from: from });
            localStorage.setItem('admin_chat_history', JSON.stringify(history));
        }

        function addMessageToChat(text, from) {
            const messageEl = document.createElement('div');
            messageEl.classList.add('message', from);
            messageEl.textContent = text;
            adminMessages.appendChild(messageEl);
            adminMessages.scrollTop = adminMessages.scrollHeight;
        }

        adminChatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const input = this.querySelector('input');
            const text = input.value.trim();
            if (!text) return;

            addMessageToChat(text, 'user');
            saveAdminHistory(text, 'user');

            setTimeout(() => {
                const reply = "Здравствуйте! Ваш вопрос принят. Мы ответим вам по телефону или почте.";
                addMessageToChat(reply, 'admin');
                saveAdminHistory(reply, 'admin');
            }, 1000);

            input.value = '';
        });

        loadAdminHistory();
        // --- КОНЕЦ КОДА ЧАТА ---

        // === ОСТАТКИ ===
        // Доступный остаток = остаток на складе минус то, что уже лежит в корзине.
        // Карточки и кнопки пересчитываются от этой функции, поэтому цифры всегда актуальны.
        function getAvailableStock(id) {
            const product = products.find(p => p.id === id);
            if (!product) return 0;
            const inCart = cart.find(c => c.id === id);
            return Math.max(0, product.stock - (inCart ? inCart.qty : 0));
        }

        function getStockInfo(available) {
            if (available <= 0) return { cls: 'stock-low', text: 'Нет в наличии' };
            if (available < 10) return { cls: 'stock-low', text: `ОСТАТОК: ${available} шт — мало!` };
            if (available < 30) return { cls: 'stock-medium', text: `Осталось: ${available} шт` };
            return { cls: 'stock-ok', text: `${available} шт в наличии` };
        }

        function isExpired(product) {
            const expiryDate = new Date(product.expiry);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return expiryDate <= today;
        }

        function renderProducts(list) {
            grid.innerHTML = '';
            list.forEach(p => {
                const el = document.createElement('div');
                el.className = 'product-card';

                const expiryDate = new Date(p.expiry);
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                let expiryClass = 'expiry-ok';
                if (expiryDate <= today) {
                    expiryClass = 'expiry-expired';
                } else if ((expiryDate - today) / (1000 * 60 * 60 * 24) <= 7) {
                    expiryClass = 'expiry-soon';
                }

                const expiryText = p.expiry ? `до ${p.expiry}` : '—';

                const available = getAvailableStock(p.id);
                const reserved = p.stock - available;          // сколько уже в корзине
                const info = getStockInfo(available);
                const expired = expiryDate <= today;

                const btnDisabled = available <= 0 || expired;
                let btnText = 'В корзину';
                if (expired) btnText = 'Просрочен';
                else if (p.stock <= 0) btnText = 'Нет в наличии';
                else if (available <= 0) btnText = 'Всё в корзине';

                el.innerHTML = `
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <div class="product-barcode">ШК: ${p.barcode}</div>
                    <div class="product-expiry ${expiryClass}">Срок годности: ${expiryText}</div>
                    <div class="stock-badge ${info.cls}">${info.text}</div>
                    ${reserved > 0 ? `<div class="in-cart-note">В корзине: ${reserved} шт</div>` : ''}
                    <button class="btn-add" data-id="${p.id}" ${btnDisabled ? 'disabled' : ''} onclick="addToCart('${p.id}')">${btnText}</button>
                `;
                grid.appendChild(el);
            });
        }

        // Перерисовка каталога с учётом текущего поиска
        function refreshProducts() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = query
                ? products.filter(p => p.name.toLowerCase().includes(query))
                : products;
            renderProducts(filtered);
        }

        // Единая точка синхронизации: корзина + остатки на карточках
        function syncCart() {
            updateCart();
            refreshProducts();
        }

        searchInput.addEventListener('input', refreshProducts);

        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            if (isExpired(product) || product.stock <= 0) {
                alert('Этот товар нельзя добавить в корзину.');
                return;
            }

            const available = getAvailableStock(id);
            if (available <= 0) {
                alert('Это максимальное количество товара на складе!');
                return;
            }

            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    barcode: product.barcode,
                    expiry: product.expiry,
                    qty: 1
                });
            }
            syncCart();
        };

        function setCartQty(id, delta) {
            const item = cart.find(c => c.id === id);
            const product = products.find(p => p.id === id);
            if (!item || !product) return;

            const next = item.qty + delta;
            if (next > product.stock) {
                alert('Это максимальное количество товара на складе!');
                return;
            }
            item.qty = Math.max(1, Math.min(next, product.stock));
            syncCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            syncCart();
        }

        function updateCart() {
            cartBody.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                const maxQty = product ? product.stock : item.qty;
                const sum = item.price * item.qty;
                total += sum;
                count += item.qty;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td class="cart-barcode-cell">${item.barcode}</td>
                    <td>${item.expiry}</td>
                    <td>${item.price} ₽</td>
                    <td>
                        <button onclick="setCartQty('${item.id}', -1)" style="padding:2px 8px; margin-right:4px;">−</button>
                        <input type="number" class="cart-qty-input" value="${item.qty}" readonly>
                        <button onclick="setCartQty('${item.id}', 1)" style="padding:2px 8px;">+</button>
                        <div class="qty-hint">макс: ${maxQty} шт</div>
                    </td>
                    <td>${sum} ₽</td>
                    <td><button class="btn-remove" onclick="removeFromCart('${item.id}')">Удалить</button>
                    </td>
                `;
                cartBody.appendChild(row);
            });

            if (cart.length === 0) {
                cartEmpty.style.display = 'block';
                cartTotalEl.textContent = '0 ₽';
                cartCountEl.textContent = '0';
                cartFooterTotalEl.textContent = '0 ₽';
            } else {
                cartEmpty.style.display = 'none';
                cartTotalEl.textContent = total + ' ₽';
                cartCountEl.textContent = count;
                cartFooterTotalEl.textContent = total + ' ₽';
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert('Корзина пуста — нельзя оформить заказ');
                return;
            }

            // Повторная проверка остатков на момент оформления
            for (const item of cart) {
                const product = products.find(p => p.id === item.id);
                if (!product || product.stock < item.qty) {
                    alert(`Товар «${item.name}» изменился по остаткам. Проверьте корзину.`);
                    syncCart();
                    return;
                }
            }

            const form = this;
            const order = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('ru-RU'),
                user: {
                    name: form[0].value,
                    phone: form[1].value,
                    comment: form[2].value
                },
                items: [...cart],
                total: cart.reduce((sum, i) => sum + i.price * i.qty, 0)
            };

            let orders = JSON.parse(localStorage.getItem('shop_orders')) || [];
            orders.push(order);
            localStorage.setItem('shop_orders', JSON.stringify(orders));

            // Списываем заказанное со склада — остатки на карточках обновятся сразу
            order.items.forEach(it => {
                const product = products.find(p => p.id === it.id);
                if (product) product.stock = Math.max(0, product.stock - it.qty);
            });

            alert('Заказ оформлен! Спасибо.');
            cart = [];
            syncCart();
        });

        // Автопересчёт: подхватывает смену суток (товар становится просроченным)
        // и любые внешние изменения массива products.
        setInterval(refreshProducts, 60000);

        refreshProducts();
    </script>
</body>
</html>
